<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>每日英语</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="每日英语">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root {
  --bg: #f4f6f5; --panel: #ffffff; --text: #1b1f1e; --muted: #6b7471; --line: #e3e7e5;
  --accent: #0f766e; --accent-ink: #ffffff; --accent-soft: #e0f2ef;
  --good: #15803d; --mid: #b45309; --bad: #b91c1c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111514; --panel: #1b2120; --text: #e8ecea; --muted: #97a19e; --line: #2c3533;
    --accent: #2dd4bf; --accent-ink: #062320; --accent-soft: #163a36;
    --good: #4ade80; --mid: #fbbf24; --bad: #f87171;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 17px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
  padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 24px);
}
#app { max-width: 560px; margin: 0 auto; }
h1 { font-size: 28px; margin: 16px 0 0; }
h2 { margin: 0 0 8px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.hidden { display: none !important; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin: 12px 0; }
.home-head p { margin: 0; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 16px 0 4px; }
.stat, .nums > div { display: flex; flex-direction: column; align-items: center; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 4px; }
.stat b, .nums b { font-size: 26px; font-variant-numeric: tabular-nums; }
.stat span, .nums span { font-size: 13px; color: var(--muted); }
.tabs { display: flex; gap: 8px; margin-top: 12px; }
.tab { flex: 1; padding: 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font-size: 16px; }
.tab.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.nums { display: grid; grid-template-columns: 1fr 1fr; margin-bottom: 12px; }
.bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.done-msg { text-align: center; font-weight: 600; color: var(--accent); }
.btn {
  appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--text);
  border-radius: 12px; padding: 10px 16px; font-size: 16px; cursor: pointer;
}
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.big { width: 100%; padding: 14px; font-size: 18px; margin-top: 12px; }
.btn.small { padding: 6px 12px; font-size: 14px; }
.btn.round { border-radius: 999px; min-width: 88px; }
.btn.recording { background: var(--bad); color: #fff; border-color: var(--bad); }
.link { background: none; border: none; color: var(--accent); font-size: 17px; padding: 8px 0; }
summary { font-weight: 600; cursor: pointer; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.row.center { justify-content: center; }
select { font-size: 16px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); }
.help { padding-left: 20px; margin: 12px 0 0; }
.help li { margin-bottom: 6px; }
.topbar { display: flex; justify-content: space-between; align-items: center; padding-top: 8px; }
.card { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 28px 16px 20px; text-align: center; margin-top: 8px; }
.badge { position: absolute; top: 12px; left: 12px; background: var(--accent-soft); color: var(--accent); font-size: 12px; padding: 2px 8px; border-radius: 999px; }
.front.word { font-size: 44px; font-weight: 700; letter-spacing: .5px; overflow-wrap: anywhere; }
.front.sentence { font-size: 26px; font-weight: 600; line-height: 1.35; }
.ipa { color: var(--muted); font-size: 18px; margin-top: 4px; }
.back { border-top: 1px dashed var(--line); margin-top: 20px; padding-top: 16px; }
.cn { font-size: 22px; font-weight: 600; }
.ex { margin-top: 12px; background: var(--accent-soft); border-radius: 12px; padding: 12px; }
.ex-en { font-size: 19px; font-weight: 500; }
.ex-cn { margin: 2px 0 8px; }
.practice { margin-top: 16px; }
.practice-title { font-weight: 600; }
.practice p { margin: 4px 0 0; }
.result { margin-top: 10px; }
.score { font-size: 28px; font-weight: 700; }
.score.good { color: var(--good); } .score.mid { color: var(--mid); } .score.bad { color: var(--bad); }
.words { font-size: 18px; }
.words .hit { color: var(--good); font-weight: 600; }
.words .miss { color: var(--bad); text-decoration: underline; }
.actions { display: flex; gap: 8px; margin-top: 16px; }
.actions .btn.big { margin-top: 0; }
.btn.grade { flex: 1; padding: 14px 4px; font-size: 17px; font-weight: 600; color: #fff; border: none; }
.btn.grade.bad { background: var(--bad); } .btn.grade.mid { background: var(--mid); } .btn.grade.good { background: var(--good); }
@media (prefers-color-scheme: dark) { .btn.grade { color: #111; } }
.finish { text-align: center; margin-top: 40px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
